<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161d29" media="(prefers-color-scheme: dark)">
<title>Magyar dogalog</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f5bd3'/%3E%3Cpath d='M9 17l5 5 9-12' stroke='%23d3342a' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=Caveat:wght@700&display=swap">
<style>
/* Layout: egy hasábos, kockás füzetlap; fent a mai kérdés, alatta a statisztika; piros toll csak a dogáknak. */
:root{
  --paper:#f8fafd;
  --grid:rgba(47,91,211,.07);
  --card:#ffffff;
  --ink:#1b2740;
  --muted:#5b6882;
  --line:#dde3ee;
  --track:#e7ecf5;
  --accent:#2f5bd3;
  --accent-soft:rgba(47,91,211,.10);
  --red:#d3342a;
  --red-soft:rgba(211,52,42,.10);
  --green:#1d8757;
  --green-soft:rgba(29,135,87,.11);
  --gray:#7d879a;
  --gray-soft:rgba(125,135,154,.14);
  --shadow:0 1px 2px rgba(27,39,64,.06),0 4px 14px rgba(27,39,64,.05);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f141d;--grid:rgba(124,156,255,.05);--card:#161d29;--ink:#e5eaf4;--muted:#97a2b7;--line:#273143;--track:#2b3548;
  --accent:#86a2ff;--accent-soft:rgba(134,162,255,.13);--red:#ff6a5c;--red-soft:rgba(255,106,92,.14);--green:#45c48b;--green-soft:rgba(69,196,139,.14);
  --gray:#76819a;--gray-soft:rgba(118,129,154,.18);--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f141d;--grid:rgba(124,156,255,.05);--card:#161d29;--ink:#e5eaf4;--muted:#97a2b7;--line:#273143;--track:#2b3548;
  --accent:#86a2ff;--accent-soft:rgba(134,162,255,.13);--red:#ff6a5c;--red-soft:rgba(255,106,92,.14);--green:#45c48b;--green-soft:rgba(69,196,139,.14);
  --gray:#76819a;--gray-soft:rgba(118,129,154,.18);--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light}
body{
  margin:0;
  padding-bottom:env(safe-area-inset-bottom,0px);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:-.01em}
.brand .cls{font-size:.75rem;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;background:var(--track);border-radius:10px;padding:3px;gap:2px}
.tab{border:0;background:transparent;padding:6px 14px;border-radius:8px;font-weight:600;font-size:.9rem;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

main{max-width:720px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:28px}
.view{display:grid;gap:28px;min-width:0}
.sec{display:grid;gap:12px;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:.8rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sec-h .hint{font-size:.82rem;color:var(--muted)}

.note{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:.9rem}
.note.warn{background:var(--red-soft)}

/* Kérdés kártya */
.ask{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;box-shadow:var(--shadow)}
.ask-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ask-when{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ask-subj{font-family:var(--f-display);font-weight:800;font-size:1.35rem;line-height:1.15;letter-spacing:-.01em}
.ask-q{margin:0;font-weight:500}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choice{border:1.5px solid var(--line);background:var(--card);border-radius:11px;padding:12px 6px;font-weight:600;font-size:.92rem;min-height:48px;transition:background .15s,border-color .15s}
.choice:hover:not(:disabled){border-color:var(--muted)}
.choice.c-igen.on{background:var(--red);border-color:var(--red);color:#fff}
.choice.c-nem.on{background:var(--green);border-color:var(--green);color:#fff}
.choice.c-elmaradt.on{background:var(--gray);border-color:var(--gray);color:#fff}
.topic{display:grid;gap:6px}
.topic label{font-size:.85rem;font-weight:600}
.topic label span{font-weight:400;color:var(--muted)}
.topic-row{display:flex;gap:8px}
.topic-row input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;font-size:16px}
.topic-row input:focus{border-color:var(--accent);outline:none}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--accent);color:#fff;white-space:nowrap}
[data-theme="dark"] .btn{color:#0f141d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0f141d}}
.btn-ghost{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:8px 14px;font-weight:600;font-size:.88rem}
.btn-danger{border:1.5px solid var(--red);background:transparent;color:var(--red);border-radius:10px;padding:8px 14px;font-weight:600;font-size:.88rem}
.btn-danger.armed{background:var(--red);color:#fff}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-igen{background:var(--red-soft);color:var(--red)}
.p-nem{background:var(--green-soft);color:var(--green)}
.p-elmaradt{background:var(--gray-soft);color:var(--gray)}
.p-nincs{background:var(--accent-soft);color:var(--accent)}

.free{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:16px;color:var(--muted)}
.free strong{color:var(--ink);font-weight:600}

/* Statisztika */
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);display:grid;gap:18px}
.donut-wrap{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.donut{width:150px;height:150px;position:relative;flex:none}
.donut svg{width:100%;height:100%;display:block}
.donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut-c b{font-family:var(--f-hand);font-weight:700;font-size:2.7rem;line-height:.9;color:var(--red)}
.donut-c small{font-size:.72rem;color:var(--muted);margin-top:2px}
.donut-c.empty b{color:var(--muted)}
.lead{margin:0 0 10px;font-size:1rem;font-weight:500;text-wrap:balance}
.legend{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:8px;font-size:.9rem}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend .n{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border-top:1px solid var(--line);padding-top:10px;min-width:0}
.tile .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--f-display);font-weight:800;font-size:1.35rem;line-height:1.2;font-variant-numeric:tabular-nums}
.tile .s{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.bars{display:grid;gap:12px}
.bar-row{display:grid;gap:5px}
.bar-top{display:flex;justify-content:space-between;gap:8px;font-size:.88rem}
.bar-top .lbl b{font-weight:600}
.bar-top .lbl span{color:var(--muted)}
.bar-top .val{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.bar-top .val b{color:var(--ink)}
.track{height:8px;background:var(--track);border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--red);border-radius:99px;transition:width .4s ease}

/* Előzmények */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.chip .c{font-variant-numeric:tabular-nums;opacity:.7;margin-left:3px}
.month{margin:8px 0 0;font-family:var(--f-display);font-weight:600;font-size:.95rem;text-transform:capitalize}
.list{display:grid;gap:8px}
.row{width:100%;text-align:left;display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.row:hover{border-color:var(--muted)}
.row[aria-expanded="true"]{border-color:var(--accent)}
.dnum{text-align:center;line-height:1.1}
.dnum b{display:block;font-family:var(--f-display);font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums}
.dnum span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.rmain{min-width:0}
.rmain .t{font-weight:600}
.rmain .t span{font-weight:400;color:var(--muted)}
.rmain .tp{font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.rmain .tp q{color:var(--red);font-family:var(--f-hand);font-size:1.15rem;quotes:none;line-height:1}
.editor{display:grid;gap:10px;padding:4px 0 6px}
.editor-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.add{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.add label{font-weight:600;font-size:.9rem}
.add input[type=date]{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 12px;font-size:16px;max-width:100%}
.add p{margin:0;color:var(--muted);font-size:.9rem}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.9rem;transition:all .2s;pointer-events:none;z-index:20;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:520px){
  .donut-wrap{grid-template-columns:1fr;justify-items:center;text-align:center}
  .donut-wrap .legend{width:100%;max-width:280px;text-align:left}
  .tiles{grid-template-columns:1fr 1fr}
  .tiles .tile:last-child{grid-column:1/-1}
  .tab{padding:6px 11px}
  .choice{font-size:.85rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand"><h1>Magyar dogalog</h1><span class="cls">12.c</span></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-fo" data-view="fo" aria-selected="true">Áttekintés</button>
      <button class="tab" role="tab" id="tab-elozmenyek" data-view="elozmenyek" aria-selected="false">Előzmények</button>
    </div>
  </div>
</header>

<main>
  <div id="notes"></div>
  <div class="view" id="view-fo">
    <section class="sec" aria-labelledby="h-ma">
      <div class="sec-h"><h2 id="h-ma">Ma</h2><span class="hint" id="today-label"></span></div>
      <div id="today"></div>
    </section>
    <section class="sec" id="pending-sec" hidden aria-labelledby="h-pend">
      <div class="sec-h"><h2 id="h-pend">Kimaradt válaszok</h2><span class="hint" id="pending-count"></span></div>
      <div id="pending" class="list"></div>
    </section>
    <section class="sec" aria-labelledby="h-stat">
      <div class="sec-h"><h2 id="h-stat">Statisztika</h2><span class="hint" id="stat-hint"></span></div>
      <div id="stats"></div>
    </section>
  </div>
  <div class="view" id="view-elozmenyek" hidden>
    <section class="sec" aria-labelledby="h-hist">
      <div class="sec-h"><h2 id="h-hist">Előzmények</h2><span class="hint">Koppints egy órára a javításhoz</span></div>
      <div class="chips" id="chips"></div>
      <div id="history"></div>
    </section>
    <section class="sec" aria-labelledby="h-add">
      <div class="sec-h"><h2 id="h-add">Régebbi óra rögzítése</h2></div>
      <div class="add">
        <label for="pick-date">Melyik napon volt?</label>
        <input type="date" id="pick-date">
        <div id="pick-out" class="list"></div>
      </div>
    </section>
  </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
import { firebaseConfig } from "./firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

// Órarend: hét napja (0=vasárnap) -> magyarórák
const SCHEDULE = {
  1:[{p:6,s:"Irodalom"}],
  2:[{p:5,s:"Irodalom"}],
  3:[{p:4,s:"Állampolgári ismeretek"}],
  4:[{p:2,s:"Irodalom"}],
  5:[{p:2,s:"Irodalom"},{p:6,s:"Magyar nyelv"}]
};
const SLOTS = [];
Object.keys(SCHEDULE).forEach(wd=>SCHEDULE[wd].forEach(l=>SLOTS.push({wd:+wd,p:l.p,s:l.s})));
const START = "2026-11-23"; // ettől kérdezi a kimaradt órákat
const DAYS = ["vasárnap","hétfő","kedd","szerda","csütörtök","péntek","szombat"];
const DAYS_SHORT = ["V","H","K","Sze","Cs","P","Szo"];
const MONTHS = ["január","február","március","április","május","június","július","augusztus","szeptember","október","november","december"];
const LABEL = {igen:"Írtunk",nem:"Nem írtunk",elmaradt:"Nem volt óra"};

let records = new Map();
let db = null, dbState = "loading", canWrite = false, authState = "pending", gotData = false, slow = false;
const ui = {view:"fo", filter:"mind", editing:null, confirmDel:null, drafts:{}, pickDate:""};
const chains = {};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const today = () => ymd(new Date());
const fmtDate = s => { const d = parse(s); return `${MONTHS[d.getMonth()]} ${d.getDate()}., ${DAYS[d.getDay()]}`; };
const fmtShort = s => { const d = parse(s); return `${MONTHS[d.getMonth()].slice(0,3)}. ${d.getDate()}.`; };

// Tanítási szünetek (2026/2027-es tanév rendje), első és utolsó nap is szünet
const BREAKS = [["2026-10-23","2026-11-01"],["2026-12-19","2027-01-03"],["2027-03-23","2027-04-04"]];
function lessonsOn(ds){
  if (BREAKS.some(([a,b]) => ds >= a && ds <= b)) return [];
  const wd = parse(ds).getDay();
  return (SCHEDULE[wd]||[]).map(l => ({id:`${ds}_${l.p}`, date:ds, period:l.p, subject:l.s}));
}
function lessonsBetween(a, b){ // a <= nap < b
  const out = []; const d = parse(a); const end = parse(b);
  while (d < end){ out.push(...lessonsOn(ymd(d))); d.setDate(d.getDate()+1); }
  return out;
}
function nextLesson(){
  const d = parse(today());
  for (let i=1;i<=14;i++){ d.setDate(d.getDate()+1); const ls = lessonsOn(ymd(d)); if (ls.length) return ls[0]; }
  return null;
}
function lessonById(id){
  const [date, p] = id.split("_");
  const s = lessonsOn(date).find(x => x.period == p);
  if (s) return s;
  const r = records.get(id);
  return r ? {id, date:r.date, period:r.period, subject:r.subject} : null;
}

/* ---------- mentés ---------- */
let toastTimer;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);
}
function writable(){ return !!db && canWrite; }

function save(lesson, patch){
  if (!writable()) { toast("Most nem lehet menteni."); return; }
  const prev = records.get(lesson.id) || {};
  const body = {
    date: lesson.date, period: lesson.period, subject: lesson.subject,
    status: prev.status || null, topic: prev.topic || "",
    ...patch, updatedAt: new Date().toISOString()
  };
  if (body.status !== "igen") body.topic = "";
  records.set(lesson.id, body); render();
  // Offline is működik: a Firestore helyben eltárolja, és feltölti, amint van net.
  toast(patch.topic !== undefined ? "Téma mentve" : "Mentve: " + LABEL[body.status]);
  const ref = doc(db, "orak", lesson.id);
  chains[lesson.id] = (chains[lesson.id] || Promise.resolve()).then(() => setDoc(ref, body)).catch(handleWriteError);
}
function remove(id){
  if (!writable()) return;
  records.delete(id); ui.editing = null; ui.confirmDel = null; render();
  toast("Bejegyzés törölve");
  const ref = doc(db, "orak", id);
  chains[id] = (chains[id] || Promise.resolve()).then(() => deleteDoc(ref)).catch(handleWriteError);
}
function handleWriteError(e){
  console.error(e);
  const code = e && e.code;
  if (code === "permission-denied") toast("A szerver elutasította a mentést.");
  else if (code === "resource-exhausted") toast("Elfogyott a napi Firebase-keret.");
  else toast("Nem sikerült menteni. Próbáld újra.");
}

/* ---------- komponensek ---------- */
const pill = st => `<span class="pill p-${st}">${LABEL[st]}</span>`;

function askCard(l){
  const r = records.get(l.id); const st = r && r.status;
  const dis = writable() ? "" : "disabled";
  const draft = ui.drafts[l.id] ?? (r && r.topic) ?? "";
  const ch = (v, t) => `<button class="choice c-${v}${st===v?" on":""}" aria-pressed="${st===v}" data-act="set" data-id="${l.id}" data-v="${v}" ${dis}>${t}</button>`;
  return `<article class="ask">
    <div class="ask-head">
      <div><div class="ask-when">${fmtDate(l.date)} · ${l.period}. óra</div><div class="ask-subj">${esc(l.subject)}</div></div>
      ${st ? pill(st) : ""}
    </div>
    <p class="ask-q">Írtatok dogát ezen az órán?</p>
    <div class="choices" role="group" aria-label="Válasz">${ch("igen","Igen")}${ch("nem","Nem")}${ch("elmaradt","Nem volt óra")}</div>
    ${st === "igen" ? `<div class="topic">
      <label for="t-${l.id}">Miből írtatok? <span>(nem kötelező)</span></label>
      <div class="topic-row">
        <input id="t-${l.id}" data-topic="${l.id}" value="${esc(draft)}" placeholder="pl. Ady Endre szerelmi lírája" maxlength="120" autocomplete="off" ${dis}>
        <button class="btn" data-act="topic" data-id="${l.id}" ${dis}>Mentés</button>
      </div></div>` : ""}
  </article>`;
}

function histRow(id, r){
  const d = parse(r.date); const open = ui.editing === id;
  const l = lessonById(id) || {id, date:r.date, period:r.period, subject:r.subject};
  return `<button class="row" data-act="edit" data-id="${id}" aria-expanded="${open}">
      <span class="dnum"><b>${d.getDate()}</b><span>${DAYS_SHORT[d.getDay()]}</span></span>
      <span class="rmain"><span class="t">${esc(r.subject)} <span>· ${r.period}. óra</span></span>
        ${r.status === "igen" ? `<span class="tp">${r.topic ? `<q>${esc(r.topic)}</q>` : "Téma nincs megadva"}</span>` : ""}</span>
      ${pill(r.status)}
    </button>
    ${open ? `<div class="editor">${askCard(l)}
      <div class="editor-foot">
        <button class="btn-ghost" data-act="close">Bezárás</button>
        ${writable() ? `<button class="btn-danger${ui.confirmDel===id?" armed":""}" data-act="del" data-id="${id}">${ui.confirmDel===id ? "Biztos? Koppints újra" : "Bejegyzés törlése"}</button>` : ""}
      </div></div>` : ""}`;
}

/* ---------- nézetek ---------- */
function renderNotes(){
  const n = [];
  if (dbState === "noconfig") n.push(`<div class="note warn">Hiányzik a Firebase beállítás. Másold be a projekt adatait a <b>firebase-config.js</b> fájlba.</div>`);
  else if (dbState === "error") n.push(`<div class="note warn">Nem sikerült betölteni az adatokat (${esc(dbErrorCode)}). Töltsd újra az oldalt.</div>`);
  else if (slow && !gotData) n.push(`<div class="note">Még nem jöttek meg az adatok. Ellenőrizd az internetkapcsolatot.</div>`);
  if (db && authState === "failed") n.push(`<div class="note warn">Nem sikerült belépni, ezért most nem tudsz válaszolni. Ellenőrizd, hogy a Firebase-ben be van-e kapcsolva a névtelen (Anonymous) bejelentkezés.</div>`);
  $("notes").innerHTML = n.join("");
  $("notes").hidden = !n.length;
}

function renderToday(){
  const t = today(); const ls = lessonsOn(t);
  $("today-label").textContent = fmtDate(t);
  if (ls.length){
    $("today").innerHTML = `<div class="list">${ls.map(askCard).join("")}</div>`;
  } else {
    const nx = nextLesson();
    $("today").innerHTML = `<div class="free"><strong>Ma nincs magyaróra.</strong>${nx ? ` A következő: ${fmtDate(nx.date)}, ${nx.period}. óra (${esc(nx.subject)}).` : ""}</div>`;
  }
  const from = START < firstRecordDate() ? START : firstRecordDate();
  const missing = lessonsBetween(from, t).filter(l => !records.has(l.id)).reverse();
  $("pending-sec").hidden = !missing.length || !gotData;
  $("pending-count").textContent = missing.length ? `${missing.length} óra` : "";
  $("pending").innerHTML = missing.slice(0, 8).map(askCard).join("");
}
function firstRecordDate(){
  let m = START; records.forEach(r => { if (r.date && r.date < m) m = r.date; }); return m;
}

function computeStats(){
  const all = [...records.values()].filter(r => r.status);
  const igen = all.filter(r => r.status === "igen");
  const nem = all.filter(r => r.status === "nem");
  const elm = all.filter(r => r.status === "elmaradt");
  const held = igen.length + nem.length;
  const heldSorted = all.filter(r => r.status !== "elmaradt").sort((a,b) => (b.date+b.period).localeCompare(a.date+a.period));
  let streak = 0; for (const r of heldSorted){ if (r.status === "igen") break; streak++; }
  const last = heldSorted.find(r => r.status === "igen");
  const slots = SLOTS.map(s => {
    const rs = all.filter(r => r.status !== "elmaradt" && parse(r.date).getDay() === s.wd && r.period === s.p);
    const y = rs.filter(r => r.status === "igen").length;
    return {...s, held: rs.length, yes: y, pct: rs.length ? Math.round(y / rs.length * 100) : 0};
  });
  return {igen:igen.length, nem:nem.length, elm:elm.length, held, pct: held ? Math.round(igen.length / held * 100) : null, streak, last, slots};
}

function renderStats(){
  if (!gotData && (dbState === "loading" || dbState === "ok")){
    $("stats").innerHTML = `<div class="stat-card"><p class="lead" style="margin:0;color:var(--muted)">Adatok betöltése…</p></div>`;
    $("stat-hint").textContent = ""; return;
  }
  const s = computeStats();
  $("stat-hint").textContent = s.held ? `${s.held} megtartott óra alapján` : "";
  const R = 56, C = 2 * Math.PI * R;
  const frac = s.held ? s.igen / s.held : 0;
  const arc = s.held ? `<circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--red)" stroke-width="16" stroke-linecap="${frac>0 && frac<1 ? "round" : "butt"}"
      stroke-dasharray="${(C*frac).toFixed(2)} ${C.toFixed(2)}" transform="rotate(-90 70 70)"/>` : "";
  const greenArc = s.held && frac < 1 ? `<circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--green)" stroke-opacity=".35" stroke-width="16" />` : "";
  let lead;
  if (!s.held) lead = "Még nincs adat. Ha megválaszoljátok a fenti kérdést, itt látszik majd, hány százalékban írtok dogát magyarórán.";
  else {
    const every = Math.round(100 / s.pct);
    lead = `A megtartott magyarórák ${s.pct}%-án írtatok dogát, vagyis ${every <= 1 ? "szinte minden órán" : `nagyjából minden ${every}. órán`}.`;
  }
  if (s.held && s.pct === 0) lead = "Eddig egyetlen megtartott magyarórán sem írtatok dogát.";
  if (s.held && s.pct === 100) lead = "Eddig minden megtartott magyarórán írtatok dogát.";
  const maxSlot = s.slots.filter(x => x.held).sort((a,b) => b.pct - a.pct)[0];

  $("stats").innerHTML = `<div class="stat-card">
    <div class="donut-wrap">
      <div class="donut" role="img" aria-label="${s.held ? `A megtartott órák ${s.pct} százalékán írtatok dogát` : "Még nincs adat"}">
        <svg viewBox="0 0 140 140"><circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--track)" stroke-width="16"/>${greenArc}${arc}</svg>
        <div class="donut-c${s.held ? "" : " empty"}"><b>${s.held ? s.pct + "%" : "–"}</b><small>dogás óra</small></div>
      </div>
      <div style="min-width:0">
        <p class="lead">${lead}</p>
        <ul class="legend">
          <li><i style="background:var(--red)"></i>Írtunk<span class="n">${s.igen}</span></li>
          <li><i style="background:var(--green);opacity:.55"></i>Nem írtunk<span class="n">${s.nem}</span></li>
          <li><i style="background:var(--gray-soft);border:1px solid var(--gray)"></i>Nem volt óra<span class="n">${s.elm}</span></li>
        </ul>
      </div>
    </div>
    <div class="tiles">
      <div class="tile"><div class="k">Összes doga</div><div class="v">${s.igen}</div><div class="s">${s.held ? `${s.held} órából` : "még nincs"}</div></div>
      <div class="tile"><div class="k">Doga nélkül</div><div class="v">${s.streak} óra</div><div class="s">${s.held ? "a legutóbbi doga óta" : "zsinórban"}</div></div>
      <div class="tile"><div class="k">Legutóbbi doga</div><div class="v">${s.last ? fmtShort(s.last.date) : "–"}</div><div class="s">${s.last ? (s.last.topic ? esc(s.last.topic) : esc(s.last.subject)) : "még nem volt"}</div></div>
    </div>
    <div class="bars">
      ${s.slots.map(x => `<div class="bar-row">
        <div class="bar-top"><span class="lbl"><b>${DAYS[x.wd][0].toUpperCase() + DAYS[x.wd].slice(1)}, ${x.p}. óra</b> <span>· ${x.s}</span></span>
          <span class="val">${x.held ? `<b>${x.pct}%</b> · ${x.yes}/${x.held}` : "nincs adat"}</span></div>
        <div class="track"><div class="fill" style="width:${x.pct}%"></div></div>
      </div>`).join("")}
    </div>
    ${maxSlot && maxSlot.pct > 0 ? `<p style="margin:0;font-size:.88rem;color:var(--muted)">A legveszélyesebb óra: <b style="color:var(--ink)">${DAYS[maxSlot.wd]} ${maxSlot.p}. óra</b> (${maxSlot.pct}%).</p>` : ""}
  </div>`;
}

function renderHistory(){
  const all = [...records.entries()].filter(([,r]) => r.status)
    .sort((a,b) => (b[1].date + pad(b[1].period)).localeCompare(a[1].date + pad(a[1].period)));
  const cnt = {mind: all.length, igen:0, nem:0, elmaradt:0};
  all.forEach(([,r]) => cnt[r.status]++);
  const chipsDef = [["mind","Mind"],["igen","Írtunk"],["nem","Nem írtunk"],["elmaradt","Nem volt óra"]];
  $("chips").innerHTML = chipsDef.map(([k,t]) => `<button class="chip" data-act="filter" data-v="${k}" aria-pressed="${ui.filter===k}">${t}<span class="c">${cnt[k]}</span></button>`).join("");
  const rows = all.filter(([,r]) => ui.filter === "mind" || r.status === ui.filter);
  if (!gotData && (dbState === "loading" || dbState === "ok")){ $("history").innerHTML = `<div class="empty">Betöltés…</div>`; return; }
  if (!rows.length){
    $("history").innerHTML = `<div class="empty">${all.length ? "Ebben a szűrőben nincs óra." : "Még nincs bejegyzés. Az Áttekintés fülön válaszolj a mai órára, vagy lent rögzíts egy régebbit."}</div>`;
    return;
  }
  let html = "", lastMonth = "";
  rows.forEach(([id, r]) => {
    const d = parse(r.date); const m = `${d.getFullYear()}. ${MONTHS[d.getMonth()]}`;
    if (m !== lastMonth){ if (lastMonth) html += `</div>`; html += `<h3 class="month">${m}</h3><div class="list">`; lastMonth = m; }
    html += histRow(id, r);
  });
  html += `</div>`;
  $("history").innerHTML = html;
}

function renderPick(){
  const inp = $("pick-date"); inp.max = today();
  if (!ui.pickDate){ $("pick-out").innerHTML = `<p>Válassz dátumot, és megjelennek az aznapi magyarórák.</p>`; return; }
  const ls = lessonsOn(ui.pickDate);
  $("pick-out").innerHTML = ls.length ? ls.map(askCard).join("") : `<p>Ezen a napon az órarend szerint nincs magyaróra.</p>`;
}

function renderView(){
  const v = ui.view;
  $("view-fo").hidden = v !== "fo";
  $("view-elozmenyek").hidden = v !== "elozmenyek";
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.view === v));
}

function render(){
  const ae = document.activeElement;
  const fid = ae && ae.id && ae.tagName === "INPUT" && ae.dataset.topic ? ae.id : null;
  const sel = fid ? ae.selectionStart : null;
  renderNotes(); renderView(); renderToday(); renderStats(); renderHistory(); renderPick();
  if (fid){ const el = $(fid); if (el){ el.focus(); try { el.setSelectionRange(sel, sel); } catch(e){} } }
}

/* ---------- események ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act],[data-view]"); if (!b) return;
  if (b.dataset.view){ go(b.dataset.view); return; }
  const id = b.dataset.id, act = b.dataset.act;
  if (act === "set"){
    const l = lessonById(id); if (!l) return;
    const cur = records.get(id);
    if (cur && cur.status === b.dataset.v) return;
    delete ui.drafts[id];
    save(l, {status: b.dataset.v});
  } else if (act === "topic"){
    saveTopic(id);
  } else if (act === "edit"){
    ui.editing = ui.editing === id ? null : id; ui.confirmDel = null; render();
  } else if (act === "close"){
    ui.editing = null; ui.confirmDel = null; render();
  } else if (act === "del"){
    if (ui.confirmDel === id) remove(id); else { ui.confirmDel = id; render(); }
  } else if (act === "filter"){
    ui.filter = b.dataset.v; render();
  }
});
function saveTopic(id){
  const l = lessonById(id); if (!l) return;
  const val = (ui.drafts[id] ?? "").trim();
  delete ui.drafts[id];
  save(l, {status:"igen", topic: val});
}
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset && t.dataset.topic) ui.drafts[t.dataset.topic] = t.value;
  if (t.id === "pick-date"){ ui.pickDate = t.value; renderPick(); }
});
document.addEventListener("keydown", e => {
  const t = e.target;
  if (e.key === "Enter" && t.dataset && t.dataset.topic){ e.preventDefault(); saveTopic(t.dataset.topic); t.blur(); }
});

function go(v){
  ui.view = v; ui.editing = null; ui.confirmDel = null;
  const h = v === "fo" ? "" : "#" + v;
  if (location.hash !== h){ try { history.replaceState(null, "", h || location.pathname + location.search); } catch(e){ location.hash = h; } }
  render(); window.scrollTo({top:0});
}
function fromHash(){ ui.view = location.hash === "#elozmenyek" ? "elozmenyek" : "fo"; render(); }
window.addEventListener("hashchange", fromHash);

/* ---------- indulás ---------- */
fromHash();

let dbErrorCode = "";
function boot(){
  if (!firebaseConfig.projectId || firebaseConfig.projectId === "PROJEKT-ID"){ dbState = "noconfig"; render(); return; }
  const app = initializeApp(firebaseConfig);
  try {
    db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
  } catch (e) {
    db = initializeFirestore(app, {});
  }
  dbState = "ok"; render();

  // Névtelen belépés: senkinek nem kell fiók, de írni csak belépve lehet (lásd firestore.rules).
  const auth = getAuth(app);
  onAuthStateChanged(auth, user => {
    if (user){ authState = "ok"; canWrite = true; render(); }
  });
  signInAnonymously(auth).catch(e => {
    console.error(e); authState = "failed"; canWrite = false; render();
  });

  const timer = setTimeout(() => { slow = true; render(); }, 10000);
  onSnapshot(collection(db, "orak"), { includeMetadataChanges: true }, snap => {
    records = new Map(snap.docs.map(x => [x.id, x.data()]));
    gotData = true;
    if (!snap.metadata.fromCache){ clearTimeout(timer); slow = false; }
    render();
  }, err => {
    console.error(err);
    clearTimeout(timer);
    dbState = "error"; dbErrorCode = err && err.code || "ismeretlen hiba"; gotData = true;
    render();
  });
}
boot();
</script>
</body>
</html>
